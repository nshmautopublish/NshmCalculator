name: Build and Deploy to Another Repository

on:
  push:
  pull_request:
    branches: [ pve_3.4 ]
    paths:
      - '**.cs'
      - '**.csproj'
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出当前仓库代码
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 设置.NET环境
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.404'
      
      # 3. 恢复NuGet包
      - name: Restore dependencies
        run: dotnet restore
      
      # 4. 构建项目
      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      # 5. 发布Blazor WebAssembly项目
      - name: Publish Blazor WASM
        run: dotnet publish --configuration Release --output publish_output --no-build
      
      # 6. 准备部署文件
      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy_dist
          
          if [ -d "publish_output/wwwroot" ]; then
            cp -r publish_output/wwwroot/* deploy_dist/
          else
            cp -r publish_output/* deploy_dist/
          fi
          
          echo "Deployment files prepared successfully"


      - name: Analyze Publish Output
        run: |
          echo "=== 发布产物分析 ==="
          echo "发布目录: publish_output"
          echo "目录结构:"
          ls -la publish_output/
          
          echo ""
          echo "文件统计:"
          find publish_output -type f | wc -l
          
          echo ""
          echo "文件大小统计:"
          du -sh publish_output
          du -sh publish_output/*
          
          echo ""
          echo "前20个文件详情:"
          find publish_output -type f | head -20
          
          echo ""
          echo "WASM相关文件:"
          find publish_output -name "*.wasm" -o -name "*.dll" -o -name "*.js" | head -20
          
          echo ""
          echo "WWWROOT目录内容 (如果存在):"
          if [ -d "publish_output/wwwroot" ]; then
            ls -la publish_output/wwwroot/
            echo "WWWROOT文件数:"
            find publish_output/wwwroot -type f | wc -l
            echo "WWWROOT总大小:"
            du -sh publish_output/wwwroot
          else
            echo "wwwroot目录不存在"
          fi
      
      # 7. 克隆目标仓库
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: dellbeat/nshmCalculator_Release  # 修改为目标仓库
          token: ${{ secrets.DEPLOY_TOKEN }}  # 使用个人访问令牌
          path: target_repo
      
      # 8. 同步文件到目标仓库
      - name: Sync Files to Target Repository
        run: |
          cd target_repo
          
          rm -rf dist/*

          cp -r ../deploy_dist/* dist/ || true

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions@users.noreply.github.com"
      
      # 9. 提交并推送到目标仓库
      - name: Commit and Push to Target Repository
        run: |
          cd target_repo
          
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git add .

          git commit -m "Deploy Blazor WASM from ${{ github.repository }}@${{ github.sha }}"

          git push origin main
