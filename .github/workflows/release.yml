name: Build and Deploy Blazor WASM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出当前仓库代码
    - name: Checkout Source Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 2. 设置.NET环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    # 3. 恢复NuGet包
    - name: Restore dependencies
      run: dotnet restore
    
    # 4. 构建项目
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    # 5. 发布Blazor WebAssembly项目
    - name: Publish Blazor WASM
      run: |
        dotnet publish --configuration Release \
          --output publish_output \
          --no-build \
          -p:BlazorEnableCompression=true
    
    # 6. 检查发布产物
    - name: Inspect Blazor Output
      run: |
        echo "=== Blazor WASM 产物检查 ==="
        
        if [ ! -d "publish_output/wwwroot" ]; then
          echo "错误: publish_output/wwwroot 目录不存在!"
          echo "当前目录结构:"
          ls -la publish_output/
          exit 1
        fi
        
        echo "wwwroot 目录内容:"
        ls -la publish_output/wwwroot/
        
        echo ""
        echo "关键文件检查:"
        # 检查必要的Blazor文件
        REQUIRED_FILES=(
          "_framework/blazor.webassembly.js"
          "_framework/dotnet.wasm"
          "index.html"
        )
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ -f "publish_output/wwwroot/$file" ]; then
            echo "✅ 找到: $file"
          else
            echo "⚠️  未找到: $file"
            # 尝试查找类似文件
            find publish_output/wwwroot -name "$(basename "$file")" | head -3
          fi
        done
        
        echo ""
        echo "文件统计:"
        echo "总文件数: $(find publish_output/wwwroot -type f | wc -l)"
        echo "总大小: $(du -sh publish_output/wwwroot)"
    
    # 7. 配置Git（用于推送到目标仓库）
    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"
    
    # 8. 准备目标仓库
    - name: Prepare Target Repository
      env:
        TARGET_REPO_URL: "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/dellbeat/nshmCalculator_Release.git"
      run: |
        echo "准备目标仓库..."
        
        # 创建临时目录
        mkdir -p /tmp/target_repo
        cd /tmp/target_repo
        
        # 尝试克隆目标仓库
        if git clone --depth 1 "$TARGET_REPO_URL" . 2>/dev/null; then
          echo "✅ 成功克隆目标仓库"
        else
          echo "目标仓库为空或不存在，初始化..."
          git init
          git remote add origin "$TARGET_REPO_URL"
          
          # 创建初始提交
          echo "# Blazor WASM Deployment" > README.md
          echo "Automatically deployed from GitHub Actions" >> README.md
          git add README.md
          git commit -m "Initial commit"
          
          # 尝试推送到main或master分支
          if git push --set-upstream origin main 2>/dev/null; then
            echo "✅ 创建main分支"
          elif git push --set-upstream origin master 2>/dev/null; then
            echo "✅ 创建master分支"
          else
            echo "❌ 无法创建分支"
            exit 1
          fi
        fi
    
    # 9. 部署到目标仓库
    - name: Deploy to Target Repository
      env:
        TARGET_REPO_URL: "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/<目标用户名>/<目标仓库名>.git"
      run: |
        echo "开始部署..."
        
        # 进入工作目录
        cd /tmp/target_repo
        
        # 获取当前分支名
        BRANCH_NAME=$(git branch --show-current || echo "main")
        echo "目标分支: $BRANCH_NAME"
        
        # 拉取最新更改（避免冲突）
        git pull origin "$BRANCH_NAME" --rebase --allow-unrelated-histories 2>/dev/null || true
        
        # 清空目标仓库（保留.git目录）
        echo "清空目标仓库..."
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} + 2>/dev/null || true
        
        # 复制Blazor WASM产物
        echo "复制Blazor文件..."
        cp -r "${{ github.workspace }}/publish_output/wwwroot/." .
        
        # 添加所有文件到Git
        echo "添加文件到Git..."
        git add -A .
        
        # 检查是否有变更
        CHANGES=$(git status --porcelain | wc -l)
        echo "检测到 $CHANGES 个变更"
        
        if [ $CHANGES -eq 0 ]; then
          echo "没有变更需要提交"
          
          # 但为了确保部署记录，创建一个空提交
          git commit --allow-empty -m "No changes - ${{ github.sha }}"
        else
          echo "提交变更..."
          git commit -m "Deploy Blazor WASM from ${{ github.repository }}
          
          Source: ${{ github.repository }}@${{ github.sha }}
          Commit: ${{ github.event.head_commit.message }}
          Workflow: ${{ github.workflow }}
          Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
        fi
        
        # 推送到目标仓库
        echo "推送到目标仓库..."
        
        # 重试逻辑
        for i in {1..3}; do
          if git push origin "$BRANCH_NAME"; then
            echo "✅ 部署成功!"
            break
          else
            echo "⚠️  推送失败 (尝试 $i/3)"
            sleep 5
            
            # 尝试拉取并合并
            if [ $i -lt 3 ]; then
              git pull origin "$BRANCH_NAME" --rebase
            fi
          fi
        done
        
        # 清理临时目录
        cd "${{ github.workspace }}"
        rm -rf /tmp/target_repo
        
        echo "部署流程完成"
    
    # 10. 验证部署（可选）
    - name: Verify Deployment
      run: |
        echo "=== 部署验证 ==="
        echo "✅ 工作流执行完成"
        echo "📦 源仓库: ${{ github.repository }}"
        echo "🔗 目标仓库: <目标用户名>/<目标仓库名>"
        echo "🏷️  提交: ${{ github.sha }}"
        echo "👤 触发者: ${{ github.actor }}"
